name: Consumo de Vercel

# Control diario del gasto en Vercel (scripts/vercel-consumo.mjs). Desde el
# 2026-11-14 las peticiones y la transferencia se cobran por uso (se quitó el
# paquete «Flat Rate CDN 10M»), y se pagan del crédito de $20 del Pro junto
# con las compilaciones. Esto proyecta el cierre del ciclo cada mañana:
#   verde / amarillo → la corrida pasa (amarillo deja un aviso)
#   rojo             → la corrida FALLA y GitHub manda el correo
# El detalle de cada día queda en el resumen de la corrida.
#
# Secretos: VERCEL_CONSUMO_TOKEN (token propio, creado el 2026-11-14: el
# VERCEL_TOKEN de entorno-pruebas da «User not found» en las consultas de
# facturación) y VERCEL_TEAM_ID.

on:
  schedule:
    - cron: '0 13 * * *'   # 07:00 SV
  workflow_dispatch:

jobs:
  consumo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Versión FIJA: `billing usage` y `billing budgets` necesitan ≥ 65.11.
      - run: npm install -g vercel@65.16.0
      - run: node scripts/vercel-consumo.mjs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_CONSUMO_TOKEN || secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
      # Si falla, qué contesta Vercel a ese token en cada consulta (sólo códigos).
      - if: failure()
        run: |
          for u in "/v2/user" "/v9/projects?limit=1&teamId=$T" "/v2/budgets?limit=1&teamId=$T"; do
            echo "$u → $(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com$u")"
          done
          echo "/v2/billing/costs → $(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $VERCEL_TOKEN" -H 'Content-Type: application/json' \
            -d '{"from":"2026-11-13T00:00:00Z","to":"2026-11-14T00:00:00Z","metrics":["gross_cost"],"format":"timeseries","views":{"s":{"groupBy":["product"]}}}' \
            "https://api.vercel.com/v2/billing/costs?teamId=$T")"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_CONSUMO_TOKEN || secrets.VERCEL_TOKEN }}
          T: ${{ secrets.VERCEL_TEAM_ID }}
