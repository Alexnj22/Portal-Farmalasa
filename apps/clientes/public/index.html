<!DOCTYPE html>
<!-- La página que envuelve a Puntos Salud en el navegador (app.farmasalud.lat,
     scripts/subir-web-clientes.mjs). Expo la usa en lugar de la suya: en
     español, con el fondo del arranque de la app para que no destelle blanco,
     y con manifiesto e ícono para que «Agregar a inicio» la abra como app. -->
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>Puntos Salud</title>
    <meta name="description" content="Tus puntos, ofertas, reservas, facturas y el chat con Farmacias Salud." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Puntos Salud" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Los íconos (componentes/Icono.js): en el teléfono los dibuja el
         sistema; en el navegador, esta fuente con los mismos nombres. -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" />
    <style id="expo-reset">
      /* Sin theme-color: Safari pinta la barra de estado y la de abajo con
         el fondo de la página. El fondo repite las manchas de la aurora
         (componentes/Aurora.js) para que esas franjas sigan el degradado y
         no queden como bandas negras encima y debajo de la app. */
      html, body { height: 100%; }
      /* Un solo tono en la web (2026-11-14, «mejor deja un tono, algo que se
         vea bien»): Safari pinta la franja de la hora con el color del fondo,
         y con las manchas de la aurora esa franja salía como una barra negra
         encima de la app. Con un tono parejo, la franja ES la app. La aurora
         no se pinta en la web (componentes/Aurora.js). */
      html { background-color: #F5F4F8; }
      body { background: transparent; }
      @media (prefers-color-scheme: dark) { html { background-color: #15131B; } }
      body { overflow: hidden; }
      #root { display: flex; height: 100%; flex: 1; position: relative; z-index: 1; }
      #fondo-vivo i {
        position: fixed; z-index: 0; pointer-events: none; display: block;
        width: min(78vw, 560px); aspect-ratio: 1; border-radius: 50%;
        background: radial-gradient(circle, var(--c) 0%, transparent 68%);
        will-change: transform; animation: deriva 26s ease-in-out infinite alternate;
      }
      #fondo-vivo i:nth-child(1) { --c: rgba(142, 195, 15, 0.38); top: 16vh; left: 0; animation-duration: 23s; }
      #fondo-vivo i:nth-child(2) { --c: rgba(152, 29, 151, 0.34); top: 34vh; right: 0; animation-duration: 31s; animation-direction: alternate-reverse; }
      #fondo-vivo i:nth-child(3) { --c: rgba(142, 195, 15, 0.28); top: 52vh; left: 18vw; animation-duration: 37s; }
      @media (prefers-color-scheme: dark) {
        #fondo-vivo i:nth-child(1) { --c: rgba(142, 195, 15, 0.40); }
        #fondo-vivo i:nth-child(2) { --c: rgba(152, 29, 151, 0.55); }
        #fondo-vivo i:nth-child(3) { --c: rgba(142, 195, 15, 0.30); }
      }
      @keyframes deriva {
        0%   { transform: translate(-8%, -6%) scale(1); }
        50%  { transform: translate(10%, 8%) scale(1.12); }
        100% { transform: translate(-4%, 12%) scale(0.94); }
      }
      @media (prefers-reduced-motion: reduce) { #fondo-vivo i { animation: none; } }
      /* La página se desplaza (lib/documentoWeb.js): así el contenido pasa
         bajo la barra de estado y la de direcciones de Safari, que recortan
         todo lo fijo. */
      html.documento, html.documento body { height: auto; min-height: 100%; }
      html.documento body { overflow: visible; }
      html.documento #root { height: auto; min-height: 100vh; }
      /* Nada se sale de lado: una pieza oculta de 2000 px dentro de una
         tarjeta del Inicio dejaba deslizar la página hacia la derecha. */
      html, body, #root { overflow-x: clip; }
      /* Al bajar, lo que flota del encabezado (la foto, el logo, la campana)
         lleva su vidrio, para leerse sobre el contenido que pasa debajo. */
      html.documento [data-flota] { transition: background-color 0.2s, box-shadow 0.2s; border-radius: 999px; }
      html.documento.desplazada [data-flota] {
        background-color: rgba(245, 244, 248, 0.78);
        -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%);
        box-shadow: 0 0 0 6px rgba(245, 244, 248, 0.78), 0 4px 14px 6px rgba(0, 0, 0, 0.12);
      }
      /* Safari del iPhone: sin difuminado cerca del borde (lib/documentoWeb). */
      html.documento.desplazada [data-flota][data-sin-desenfoque] {
        -webkit-backdrop-filter: none; backdrop-filter: none; background-color: rgba(245, 244, 248, 0.95);
        box-shadow: 0 0 0 6px rgba(245, 244, 248, 0.95), 0 4px 14px 6px rgba(0, 0, 0, 0.12);
      }
      html.documento.desplazada.oscura [data-flota][data-sin-desenfoque] {
        background-color: rgba(36, 33, 44, 0.95); box-shadow: 0 0 0 6px rgba(36, 33, 44, 0.95), 0 4px 14px 6px rgba(0, 0, 0, 0.35);
      }
      html.documento.desplazada.oscura [data-flota] {
        background-color: rgba(36, 33, 44, 0.8);
        box-shadow: 0 0 0 6px rgba(36, 33, 44, 0.8), 0 4px 14px 6px rgba(0, 0, 0, 0.35);
      }
    </style>
  </head>
  <body>
    <noscript>Para usar Puntos Salud hay que activar JavaScript.</noscript>
    <!-- Fondo vivo (2026-11-14): manchas con el verde y el magenta del logo
         que se mueven despacio detrás del vidrio. Sólo decoración: no se
         toca, no se lee, no ocupa lugar. Cada mancha es una pieza suelta y
         lejos de arriba y de abajo: algo fijo de lado a lado hace que Safari
         del iPhone pinte la franja de la hora como una barra. -->
    <div id="fondo-vivo" aria-hidden="true"><i></i><i></i><i></i></div>
    <div id="root"></div>
  </body>
</html>
